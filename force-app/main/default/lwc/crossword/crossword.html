<template>
  <template lwc:if={attempt}>
    <div>
      <lightning-card variant="narrow">
        <h1 slot="title">{attempt.Crossword__r.Name}</h1>
        <c-crossword-grid attempt={attempt}> </c-crossword-grid>
      </lightning-card>
    </div>
  </template>
  <template lwc:if={showSpinner}>
    <lightning-spinner
      alternative-text="Loading"
      size="x-small"
    ></lightning-spinner>
  </template>
</template>
