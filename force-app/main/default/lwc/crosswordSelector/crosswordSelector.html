<template>
  <lightning-datatable
    key-field="crosswordId"
    columns={columns}
    data={crosswordsWithAttempt}
    max-row-selection="1"
    onrowselection={handleRowSelection}
    selected-rows={selectedRow}
    default-sort-direction={defaultSortDirection}
    sorted-direction={sortDirection}
    sorted-by={sortedBy}
    onsort={onHandleSort}
  >
  </lightning-datatable>
</template>
