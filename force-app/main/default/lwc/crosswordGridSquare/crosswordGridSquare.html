<template>
  <div
    lwc:ref="crosswordSquare"
    class="crossword-square"
    onclick={handleSquareClick}
  >
    <div class="clue-number">{clueNumber}</div>
    <template lwc:if={isPlayable}> </template>
    <template lwc:else>
      <div class="answer">{answer}</div>
    </template>
  </div>
</template>
