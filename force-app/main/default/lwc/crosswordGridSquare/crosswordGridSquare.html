<template>
  <div
    lwc:ref="crosswordSquare"
    class="crossword-square"
    onclick={handleSquareClick}
    onkeydown={handleGuess}
    tabindex="0"
  >
    <div class="clue-number">{clueNumber}</div>
    <div class="square-value">
      <template lwc:if={isPlayable}>{guess}</template>
      <template lwc:else> {answer} </template>
    </div>
  </div>
</template>
